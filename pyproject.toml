[build-system]
requires = ["setuptools>=84.0.0", "wheel", "setuptools_scm[toml]>=10.2.3"]
build-backend = "setuptools.build_meta"

[project]
name = "solarstorm_scout"
version = "1.1.0"
description = "Space Weather Social Media Bot - Posts HF propagation updates to Bluesky and Mastodon"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MPL-2.0"}
authors = [
    {name = "SolarStorm Scout Team"}
]
keywords = ["space-weather", "ham-radio", "propagation", "social-media", "bot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL-2.0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# Bluesky/Mastodon posting, LLM generation, config and secrets come from
# hypeman-social, the core shared with Boon-Tube-Daemon, stream-daemon and
# Star-Daemon. requirements.txt is the hash-locked install; this list is the
# floor for anyone installing the package directly.
dependencies = [
    "hypeman-social[bluesky,mastodon,ollama]>=0.3.0,<0.4",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
doppler = ["hypeman-social[doppler]>=0.3.0,<0.4"]
gemini = ["hypeman-social[gemini]>=0.3.0,<0.4"]
dev = ["pytest>=9.1.1", "ruff>=0.15.0"]

[project.scripts]
solarstorm_scout = "solarstorm_scout.main:main"

[project.urls]
Homepage = "https://github.com/chiefgyk3d/solarstorm_scout"
Repository = "https://github.com/chiefgyk3d/solarstorm_scout"
Issues = "https://github.com/chiefgyk3d/solarstorm_scout/issues"

[tool.setuptools]
packages = ["solarstorm_scout"]
